name: Nux cross-build

on:
  push:
    paths:
      - "XCU/**"
      - ".github/workflows/nux-build.yml"
  pull_request:
    paths:
      - "XCU/**"
      - ".github/workflows/nux-build.yml"
  workflow_dispatch:

jobs:
  cross-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install cross toolchains and ISO tools
        run: |
          sudo apt-get update
          sudo apt-get install -y make gcc-x86-64-linux-gnu binutils-x86-64-linux-gnu gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu xorriso qemu-system-x86 qemu-system-arm ovmf qemu-efi-aarch64 mtools
      - name: Validate headers, build kernels, and run tests
        run: make -C XCU clean all NUX_QEMU_SEMIHOST=1
      - name: Print x86 kernel entry symbol map
        run: |
          x86_64-linux-gnu-addr2line -f -C -e XCU/Build/x86_64/nux.elf 0xffffffff8000042b
          x86_64-linux-gnu-objdump -d --start-address=0xffffffff80000400 --stop-address=0xffffffff80000460 XCU/Build/x86_64/nux.elf
      - name: Package UEFI boot images
        run: make -C XCU iso uefi-disk uefi-disk-aarch64-qemu
      - name: Inspect x86-64 kernel entry disassembly
        run: |
          nm -n XCU/Build/x86_64/nux.elf | head -n 80
          objdump -d --start-address=0xffffffff800003e0 --stop-address=0xffffffff80000480 XCU/Build/x86_64/nux.elf
      - name: Boot x86-64 image under QEMU
        run: |
          cp /usr/share/OVMF/OVMF_VARS_4M.fd XCU/Build/OVMF_VARS.fd
          set +e
          timeout 12s qemu-system-x86_64 -machine q35 -m 1G -boot menu=off -drive if=pflash,format=raw,readonly=on,file=/usr/share/OVMF/OVMF_CODE_4M.fd -drive if=pflash,format=raw,file=XCU/Build/OVMF_VARS.fd -drive if=none,id=usbdisk,format=raw,file=XCU/Build/lenix-x86_64-uefi.img -device qemu-xhci -device usb-storage,drive=usbdisk,bootindex=1 -display none -serial file:XCU/Build/qemu-serial.log -monitor none -debugcon file:XCU/Build/qemu-x86.log -global isa-debugcon.iobase=0xe9 -d int,cpu_reset -D XCU/Build/qemu-cpu.log -no-reboot -no-shutdown
          qemu_status=$?
          set -e
          echo "QEMU exit status: $qemu_status"
          cat XCU/Build/qemu-x86.log || true
          cat XCU/Build/qemu-serial.log || true
          tail -n 80 XCU/Build/qemu-cpu.log || true
          grep -q 'NUX:USER_EXIT' XCU/Build/qemu-x86.log
          grep -q 'NUX:READY' XCU/Build/qemu-x86.log
      - name: Boot AArch64 image under QEMU
        run: |
          cp /usr/share/AAVMF/AAVMF_VARS.fd XCU/Build/AAVMF_VARS.fd
          set +e
          timeout 15s qemu-system-aarch64 -machine virt -cpu cortex-a72 -m 1G -boot menu=off -drive if=pflash,format=raw,readonly=on,file=/usr/share/AAVMF/AAVMF_CODE.fd -drive if=pflash,format=raw,file=XCU/Build/AAVMF_VARS.fd -drive if=none,id=usbdisk,format=raw,file=XCU/Build/lenix-aarch64-qemu-uefi.img -device qemu-xhci -device usb-storage,drive=usbdisk,bootindex=1 -semihosting-config enable=on,target=native -display none -serial file:XCU/Build/qemu-arm-serial.log -monitor none -d int,cpu_reset -D XCU/Build/qemu-arm-cpu.log -no-reboot -no-shutdown > XCU/Build/qemu-arm.log 2>&1
          qemu_status=$?
          set -e
          echo "QEMU ARM exit status: $qemu_status"
          cat XCU/Build/qemu-arm.log || true
          cat XCU/Build/qemu-arm-serial.log || true
          tail -n 120 XCU/Build/qemu-arm-cpu.log || true
          grep -q 'NUX:USER_EXIT' XCU/Build/qemu-arm.log
          grep -q 'NUX:READY' XCU/Build/qemu-arm.log
      - name: Publish kernels and boot images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nux-kernels-and-uefi-images
          path: |
            XCU/Build/x86_64/nux.elf
            XCU/Build/aarch64/nux.elf
            XCU/Build/lenix-x86_64.iso
            XCU/Build/lenix-aarch64.iso
            XCU/Build/lenix-x86_64-uefi.img
            XCU/Build/lenix-aarch64-uefi.img
            XCU/Build/lenix-aarch64-qemu-uefi.img

  macos-cross-build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install LLVM and ISO tools
        run: |
          brew install llvm lld xorriso mtools
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
      - name: Build, test, and package both UEFI targets with Clang/LLD
        run: make -C XCU clean all iso uefi-disk
