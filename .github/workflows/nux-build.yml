name: Nux cross-build

on:
  push:
    paths:
      - "XCU/**"
      - ".github/workflows/nux-build.yml"
  pull_request:
    paths:
      - "XCU/**"
      - ".github/workflows/nux-build.yml"
  workflow_dispatch:

jobs:
  cross-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install cross toolchains
        run: |
          sudo apt-get update
          sudo apt-get install -y make gcc-x86-64-linux-gnu binutils-x86-64-linux-gnu gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu xorriso
      - name: Validate public headers and build both kernels
        run: make -C XCU clean all
      - name: Package UEFI boot images\n        run: make -C XCU iso\n      - name: Publish kernel and boot image artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nux-kernel-elf
          path: |
            XCU/Build/x86_64/nux.elf
            XCU/Build/aarch64/nux.elf\n            XCU/Build/lenix-x86_64.iso\n            XCU/Build/lenix-aarch64.iso

  macos-cross-build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install LLVM
        run: |
          brew install llvm xorriso
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
      - name: Build and test both ELF targets with Clang/LLD
        run: make -C XCU clean all
