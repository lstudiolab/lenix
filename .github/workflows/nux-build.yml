name: Nux cross-build

on:
  push:
    paths:
      - "XCU/**"
      - ".github/workflows/nux-build.yml"
  pull_request:
    paths:
      - "XCU/**"
      - ".github/workflows/nux-build.yml"
  workflow_dispatch:

jobs:
  cross-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install cross toolchains and ISO tools
        run: |
          sudo apt-get update
          sudo apt-get install -y make gcc-x86-64-linux-gnu binutils-x86-64-linux-gnu gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu xorriso qemu-system-x86 ovmf
      - name: Validate headers, build kernels, and run tests
        run: make -C XCU clean all
      - name: Package UEFI boot images
        run: make -C XCU iso
      - name: Boot x86-64 image under QEMU
        run: |
          cp /usr/share/OVMF/OVMF_VARS_4M.fd XCU/Build/OVMF_VARS.fd
          set +e
          timeout 12s qemu-system-x86_64 -machine q35 -m 1G -boot order=d -drive if=pflash,format=raw,readonly=on,file=/usr/share/OVMF/OVMF_CODE_4M.fd -drive if=pflash,format=raw,file=XCU/Build/OVMF_VARS.fd -cdrom XCU/Build/lenix-x86_64.iso -display none -serial file:XCU/Build/qemu-serial.log -monitor none -debugcon file:XCU/Build/qemu-x86.log -global isa-debugcon.iobase=0xe9 -d int,cpu_reset -D XCU/Build/qemu-cpu.log -no-reboot -no-shutdown
          qemu_status=$?
          set -e
          echo "QEMU exit status: $qemu_status"
          cat XCU/Build/qemu-x86.log || true
          cat XCU/Build/qemu-serial.log || true
          tail -n 80 XCU/Build/qemu-cpu.log || true
          grep -q 'NUX:READY' XCU/Build/qemu-x86.log
      - name: Publish kernels and boot images
        uses: actions/upload-artifact@v4
        with:
          name: nux-kernels-and-uefi-images
          path: |
            XCU/Build/x86_64/nux.elf
            XCU/Build/aarch64/nux.elf
            XCU/Build/lenix-x86_64.iso
            XCU/Build/lenix-aarch64.iso

  macos-cross-build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install LLVM and ISO tools
        run: |
          brew install llvm lld xorriso
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
      - name: Build, test, and package both UEFI targets with Clang/LLD
        run: make -C XCU clean all iso
