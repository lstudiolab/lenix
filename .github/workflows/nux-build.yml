name: Nux cross-build

on:
  push:
    paths:
      - "XCU/**"
      - ".github/workflows/nux-build.yml"
  pull_request:
    paths:
      - "XCU/**"
      - ".github/workflows/nux-build.yml"
  workflow_dispatch:

jobs:
  cross-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install cross toolchains
        run: |
          sudo apt-get update
          sudo apt-get install -y make gcc-x86-64-linux-gnu binutils-x86-64-linux-gnu gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu
      - name: Validate public headers and build both kernels
        run: make -C XCU clean all
      - name: Publish ELF artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nux-kernel-elf
          path: |
            XCU/Build/x86_64/nux.elf
            XCU/Build/aarch64/nux.elf
